<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/lightFav.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/darkFav.png" media="(prefers-color-scheme: dark)">
    <title>Pricing | Unreader</title>
    <link rel="stylesheet" href="./src/styles/style.css">
    <link rel="stylesheet" href="./src/styles/home.css">
    <link rel="stylesheet" href="./src/styles/credits.css">
    <link rel="stylesheet" href="./src/styles/skeleton.css">
    <link rel="stylesheet" href="./src/styles/animation.css">
    <!-- Using self-hosted Apfel Grotezk from /public/fonts -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
      .subscriptionRow { display: flex; align-items: flex-end; }
      .planList .skeleton-plan { min-height: 56px; }

      .pricingIntro{
        color: #373737;
      }

      .links .logInLink{
        font-family: "Space Mono";
        color: #373737;
        border: 1px solid #D2D2D2;
        padding: 5px 15px;
        border-radius: 50px;
        background: white;
        transition: 0.2s all;
    }

        .pricingIntro h2{
            font-size: 21px;
            font-weight: 400;
        }

        .pricingIntro .unlimited{
            font-size: 35px;
            font-weight: 400;
            margin-top: 8px;
            text-transform: lowercase;
        }

        .pricingIntro .limited{
            font-size: 21px;
            font-weight: 400;
            margin-top: 4px;
            opacity: 0.7;
            text-transform: lowercase;
        }
    </style>
</head>
<body>
    <div id="app">
        <nav>
        <a href="/">
          <div class="logoContainer">
            <div class="sleep">z</div>
            <h2 class="logo">º/º</h2>
          </div>
        </a>
        <div class="links">
          <a href="pricing.html">pricing</a>
          <a class="logInLink" href="login.html">start your book →</a>
        </div>
      </nav>
    </div>

    <div class="home">
        <section class="pricingIntro">
            <h2>your get</h2>
            <p class="unlimited">30 days of unlimited access</p>
            <p class="limited">generous limited access thereafter</p>
            <br>
            <hr>
            <br>
            <br>
            <br>
        </section>
        <div class="addAmount">
            <div class="subscriptionRow">
              <div class="subscriptionText">for unlimited access of unreader</div>
            </div>
        </div>

        <div class="paymentOptions">
            <div class="payOptions">
                <h3 class="payHeading">choose your plan</h3>
                <div class="pOptions planList">
                    <div class="option skeleton-ui skeleton-plan"><span>&nbsp;</span><span>&nbsp;</span></div>
                    <div class="option skeleton-ui skeleton-plan"><span>&nbsp;</span><span>&nbsp;</span></div>
                </div>
            </div>

            <button class="payNowButton" id="continueBtn" type="button">
                <i class="ph ph-lock-laminated payNowIcon"></i>
                <span class="payNowButtonText">Continue</span>
            </button>
            <p class="errorMessage hidden" id="planError">Please select a plan</p>
        </div>
    </div>

    <script type="module" src="./src/utils.js"></script>
    <script type="module" src="./src/analytics.js"></script>
    <script type="module" src="./src/apiUrls.js"></script>
    <script type="module" src="./src/basic/logo-animation.js"></script>
    <script type="module" src="./src/basic/inbox.js"></script>
    <script type="module" src="./src/basic/pricing.js"></script>
</body>
</html>
